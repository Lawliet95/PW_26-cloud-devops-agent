[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-devops-agent"
version = "0.1.0"
description = "PW 26 - Assistente agentico per richieste operative Cloud/DevOps mediante Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # SDK MCP ufficiale. Versione bloccata: la linea 2.x ha API diverse dalla 1.x
    # (FastMCP -> MCPServer). Aggiornare solo dopo aver rieseguito i test.
    "mcp==2.3.0",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "jsonschema>=4.22,<5",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
devops-agent = "devops_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"devops_agent.backend" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # la lunghezza delle righe è gestita da ruff format
